<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 900; font-size: 38px; fill: #1C1917; letter-spacing: -0.5px; }
      .subtitle { font-weight: 600; font-size: 15px; fill: #292524; }
      .desc { font-weight: 500; font-size: 13px; fill: #57534E; }
      .badge-text { font-weight: 700; font-size: 11px; letter-spacing: 0.5px; }
      .tag-text { font-weight: 700; font-size: 11px; fill: #1C1917; letter-spacing: 0.3px; }
      .status-text { font-weight: 700; font-size: 10.5px; fill: #1B4332; letter-spacing: 0.5px; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E7E5E4" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Hard Drop Shadow -->
  <rect x="10" y="10" width="830" height="230" rx="6" fill="#1C1917" />

  <!-- Main Card Surface (Muted Warm Cream) -->
  <rect x="4" y="4" width="830" height="230" rx="6" fill="#F8F6F0" stroke="#1C1917" stroke-width="2.5" />
  
  <!-- Subtle Grid Background -->
  <rect x="6.5" y="6.5" width="825" height="225" rx="5" fill="url(#grid)" opacity="0.6"/>

  <!-- Window Header Bar -->
  <rect x="4" y="4" width="830" height="38" rx="6" fill="#EAE6DF" stroke="#1C1917" stroke-width="2.5" />
  <line x1="4" y1="42" x2="834" y2="42" stroke="#1C1917" stroke-width="2.5" />

  <!-- Window Control Dots -->
  <circle cx="26" cy="23" r="5.5" fill="#E07A5F" stroke="#1C1917" stroke-width="1.5" />
  <circle cx="44" cy="23" r="5.5" fill="#F2CC8F" stroke="#1C1917" stroke-width="1.5" />
  <circle cx="62" cy="23" r="5.5" fill="#81B29A" stroke="#1C1917" stroke-width="1.5" />

  <!-- Window Title -->
  <text x="84" y="27" class="mono" font-size="12" font-weight="700" fill="#44403C">mahadevan.sh — generalist &#8226; data &#8226; scripts</text>

  <!-- Status Badge (Top Right) -->
  <g transform="translate(636, 12)">
    <rect x="2" y="2" width="186" height="22" rx="3" fill="#1C1917" />
    <rect x="0" y="0" width="186" height="22" rx="3" fill="#D8F3DC" stroke="#1C1917" stroke-width="1.5" />
    <circle cx="12" cy="11" r="4" fill="#2D6A4F" />
    <text x="22" y="15" class="mono status-text">OPEN FOR COLLABORATION</text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(32, 58)">
    <rect x="2" y="2" width="210" height="22" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="210" height="22" rx="2" fill="#708D81" stroke="#1C1917" stroke-width="1.5" />
    <text x="10" y="15" class="mono badge-text" fill="#FFFFFF">GENERALIST &#8226; DATA &amp; BUILDER</text>
  </g>

  <!-- Main Headline -->
  <text x="32" y="118" class="sans title">MAHADEVAN</text>

  <!-- Subtitle & Focus -->
  <text x="32" y="146" class="sans subtitle">Data Management &#8226; Marketing &#8226; E-Commerce &#8226; Personal Scripts &amp; Apps</text>
  <text x="32" y="170" class="mono desc">Bridging cross-functional business execution with data analytics, automation &amp; exploratory coding.</text>

  <!-- Neo-Brutalist Tags at Bottom -->
  <!-- Tag 1: Data Analytics -->
  <g transform="translate(32, 192)">
    <rect x="2" y="2" width="130" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="130" height="26" rx="2" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />
    <text x="10" y="17" class="mono tag-text"># DATA ANALYTICS</text>
  </g>

  <!-- Tag 2: Data Management -->
  <g transform="translate(170, 192)">
    <rect x="2" y="2" width="146" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="146" height="26" rx="2" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />
    <text x="10" y="17" class="mono tag-text"># DATA MANAGEMENT</text>
  </g>

  <!-- Tag 3: Marketing -->
  <g transform="translate(324, 192)">
    <rect x="2" y="2" width="102" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="102" height="26" rx="2" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />
    <text x="10" y="17" class="mono tag-text"># MARKETING</text>
  </g>

  <!-- Tag 4: E-Commerce -->
  <g transform="translate(434, 192)">
    <rect x="2" y="2" width="112" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="112" height="26" rx="2" fill="#EAE0D5" stroke="#1C1917" stroke-width="1.5" />
    <text x="10" y="17" class="mono tag-text"># E-COMMERCE</text>
  </g>

  <!-- Tag 5: Python Scripts & Apps -->
  <g transform="translate(554, 192)">
    <rect x="2" y="2" width="180" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="180" height="26" rx="2" fill="#DDA15E" stroke="#1C1917" stroke-width="1.5" fill-opacity="0.3" />
    <text x="10" y="17" class="mono tag-text"># SCRIPTS &amp; SMALL APPS</text>
  </g>
</svg>
