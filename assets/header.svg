<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 900; font-size: 38px; fill: #1C1917; letter-spacing: -0.5px; }
      .subtitle { font-weight: 500; font-size: 14.5px; fill: #44403C; }
      .badge-text { font-weight: 700; font-size: 11.5px; letter-spacing: 0.5px; }
      .tag-text { font-weight: 700; font-size: 11px; fill: #1C1917; letter-spacing: 0.3px; }
      .status-text { font-weight: 700; font-size: 11px; fill: #1C1917; letter-spacing: 0.5px; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E7E5E4" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Hard Shadow -->
  <rect x="12" y="12" width="830" height="230" rx="4" fill="#1C1917" />

  <!-- Main Card Surface -->
  <rect x="6" y="6" width="830" height="230" rx="4" fill="#FAF7F2" stroke="#1C1917" stroke-width="2.5" />
  
  <!-- Subtle Grid Background -->
  <rect x="7.5" y="7.5" width="827" height="227" rx="3" fill="url(#grid)" opacity="0.6"/>

  <!-- Window Header Bar -->
  <rect x="6" y="6" width="830" height="38" rx="4" fill="#EAE5DC" stroke="#1C1917" stroke-width="2.5" />
  <!-- Prevent bottom rounded corners showing seam -->
  <line x1="6" y1="44" x2="836" y2="44" stroke="#1C1917" stroke-width="2.5" />

  <!-- Window Control Dots -->
  <circle cx="28" cy="25" r="5.5" fill="#E07A5F" stroke="#1C1917" stroke-width="1.5" />
  <circle cx="46" cy="25" r="5.5" fill="#F2CC8F" stroke="#1C1917" stroke-width="1.5" />
  <circle cx="64" cy="25" r="5.5" fill="#81B29A" stroke="#1C1917" stroke-width="1.5" />

  <!-- Window Title -->
  <text x="88" y="29" class="mono" font-size="12" font-weight="700" fill="#44403C">mahadevan.sh — 80x24</text>

  <!-- Status Badge (Top Right) -->
  <g transform="translate(640, 14)">
    <rect x="2" y="2" width="180" height="22" rx="3" fill="#1C1917" />
    <rect x="0" y="0" width="180" height="22" rx="3" fill="#D8F3DC" stroke="#1C1917" stroke-width="1.5" />
    <circle cx="13" cy="11" r="4" fill="#2D6A4F" />
    <text x="24" y="15" class="mono status-text" fill="#1B4332">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(36, 62)">
    <rect x="2" y="2" width="220" height="22" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="220" height="22" rx="2" fill="#708D81" stroke="#1C1917" stroke-width="1.5" />
    <text x="10" y="15" class="mono badge-text" fill="#FFFFFF">DATA &amp; BUSINESS ANALYTICS</text>
  </g>

  <!-- Main Headline -->
  <text x="36" y="122" class="sans title">MAHADEVAN</text>

  <!-- Subtitle / Bio -->
  <text x="36" y="150" class="sans subtitle">Transforming complex datasets into actionable business intelligence &amp; exploratory narratives.</text>
  <text x="36" y="172" class="mono" font-size="12.5" fill="#78716C">Background in E-Commerce &amp; Logistics &bull; Focused on Python, SQL, and Power BI.</text>

  <!-- Neo-Brutalist Tags at Bottom -->
  <!-- Tag 1: Python -->
  <g transform="translate(36, 194)">
    <rect x="2" y="2" width="82" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="82" height="26" rx="2" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />
    <text x="10" y="17" class="mono tag-text"># PYTHON</text>
  </g>

  <!-- Tag 2: SQL -->
  <g transform="translate(128, 194)">
    <rect x="2" y="2" width="62" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="62" height="26" rx="2" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />
    <text x="10" y="17" class="mono tag-text"># SQL</text>
  </g>

  <!-- Tag 3: Power BI -->
  <g transform="translate(200, 194)">
    <rect x="2" y="2" width="94" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="94" height="26" rx="2" fill="#FFFFFF" stroke="#1C1917" stroke-width="1.5" />
    <text x="10" y="17" class="mono tag-text"># POWER BI</text>
  </g>

  <!-- Tag 4: EDA & Analytics -->
  <g transform="translate(304, 194)">
    <rect x="2" y="2" width="138" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="138" height="26" rx="2" fill="#F4A261" stroke="#1C1917" stroke-width="1.5" fill-opacity="0.25" />
    <text x="10" y="17" class="mono tag-text"># DATA PROFILING</text>
  </g>

  <!-- Tag 5: Business Intelligence -->
  <g transform="translate(452, 194)">
    <rect x="2" y="2" width="186" height="26" rx="2" fill="#1C1917" />
    <rect x="0" y="0" width="186" height="26" rx="2" fill="#81B29A" stroke="#1C1917" stroke-width="1.5" fill-opacity="0.25" />
    <text x="10" y="17" class="mono tag-text"># BUSINESS INTELLIGENCE</text>
  </g>
</svg>
